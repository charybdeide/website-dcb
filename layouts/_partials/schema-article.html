{{- $image := .Params.image | default site.Params.metadata.meta_image -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  {{- with .Description }}
  "description": "{{ . }}",
  {{- end }}
  {{- with $image }}
    {{- $src := strings.TrimPrefix "/" . -}}
    {{- $url := "" -}}
    {{- if hasPrefix $src "http" -}}
      {{- $url = $src -}}
    {{- else -}}
      {{- with resources.Get $src -}}
        {{- /* images live in assets/ now: publish a resized rendition and use
               its absolute URL. Keep the original format — some social and
               search crawlers still do not accept webp. */ -}}
        {{- if eq (path.Ext $src) ".svg" -}}
          {{- $url = .Permalink -}}
        {{- else -}}
          {{- $url = (.Resize "1200x").Permalink -}}
        {{- end -}}
      {{- else -}}
        {{- $url = (printf "%s%s" site.BaseURL $src) -}}
      {{- end -}}
    {{- end }}
  "image": "{{ $url }}",
  {{- end }}
  "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}",
  {{- with .Lastmod }}
  "dateModified": "{{ .Format "2006-01-02T15:04:05Z07:00" }}",
  {{- end }}
  "author": {
    "@type": "Organization",
    "name": "Diaspora Civică Berlin",
    "url": "{{ site.BaseURL }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Diaspora Civică Berlin",
    "logo": {
      "@type": "ImageObject",
      {{- with resources.Get "images/logo.png" }}
      "url": "{{ .Permalink }}"
      {{- end }}
    }
  },
  "inLanguage": "{{ site.LanguageCode }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
}
</script>
