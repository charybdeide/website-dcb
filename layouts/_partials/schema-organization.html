<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NGO",
  "name": "Diaspora Civică Berlin",
  "alternateName": "DCB — Rumänische Diaspora Initiative e.V.",
  "url": "{{ site.BaseURL }}",
  "logo": "{{ site.BaseURL }}images/logo.png",
  "image": "{{ site.BaseURL }}images/fallback.png",
  "description": "{{ site.Params.metadata.meta_description }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Oderstrasse 16",
    "addressLocality": "Berlin",
    "postalCode": "10247",
    "addressCountry": "DE"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "email": "contact@diasporacivica.berlin",
    "contactType": "general",
    "availableLanguage": ["Romanian", "German", "English"]
  },
  "sameAs": [
    {{- range $i, $s := site.Params.social -}}
      {{- if $i }}, {{ end -}}
      "{{ $s.link }}"
    {{- end -}}
  ]
}
</script>
